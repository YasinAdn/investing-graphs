<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Currencies &amp; Live FX — InvestGraph</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="currencies">
  <div class="app-container">
    <div id="sharedShellTop"></div>

    <main>
      <!-- Live Historical FX Graph -->
      <section class="graph-card">
        <div class="card-top-bar">
          <div>
            <h2 class="card-title" id="fxChartTitle">Live Exchange Rate: 1 USD in PKR (1Y)</h2>
            <p class="card-meta" id="fxChartMeta">Real exchange rate history from Yahoo Finance</p>
          </div>
          <div class="controls-toggles" id="fxRangeBar">
            <button type="button" class="toggle-chip" data-range="1d">1D</button>
            <button type="button" class="toggle-chip" data-range="1w">1W</button>
            <button type="button" class="toggle-chip" data-range="1m">1M</button>
            <button type="button" class="toggle-chip active" data-range="1y">1Y</button>
            <button type="button" class="toggle-chip" data-range="5y">5Y</button>
          </div>
        </div>

        <div class="controls-toggles" id="fxPairPills" style="margin-bottom:14px;">
          <button type="button" class="toggle-chip active" data-pair="USD:PKR">1 USD → PKR</button>
          <button type="button" class="toggle-chip" data-pair="AED:PKR">1 AED → PKR</button>
          <button type="button" class="toggle-chip" data-pair="SAR:PKR">1 SAR → PKR</button>
          <button type="button" class="toggle-chip" data-pair="GBP:PKR">1 GBP → PKR</button>
          <button type="button" class="toggle-chip" data-pair="EUR:PKR">1 EUR → PKR</button>
          <button type="button" class="toggle-chip" data-pair="EUR:USD">1 EUR → USD</button>
          <button type="button" class="toggle-chip" data-pair="GBP:USD">1 GBP → USD</button>
        </div>

        <div class="chart-stage">
          <div id="fxChartContainer" class="chart-container"></div>
          <div id="fxChartTooltip" class="chart-tooltip"></div>
        </div>
      </section>

      <!-- Live 18-Currency Converter -->
      <section class="panel-card">
        <div class="panel-header">
          <div>
            <h3 class="panel-title">All 18 Popular Currencies — Live Converter</h3>
            <p class="panel-sub">Click any currency box below to use it across the whole website</p>
          </div>
          <span class="source-tag" id="fxSourceBadge">Live FX</span>
        </div>

        <div class="fx-converter-box">
          <div class="fx-input-group">
            <label for="fxAmountInput">How much money?</label>
            <input type="number" id="fxAmountInput" class="fx-number-input" value="100000" min="0" step="any" />
          </div>
          <div class="fx-input-group">
            <label for="fxFromSelect">Currency</label>
            <select id="fxFromSelect" class="fx-select"></select>
          </div>
          <div class="fx-quick-actions">
            <button type="button" class="btn-ghost" id="fxSwapPkrBtn">Switch to 1,000 USD</button>
          </div>
        </div>

        <div class="fx-grid" id="fxCardsGrid"></div>
      </section>
    </main>

    <footer class="app-footer" id="sharedShellFooter"></footer>
  </div>

  <script src="vendor/gsap.min.js"></script>
  <script src="vendor/three.min.js"></script>
  <script src="finance-engine.js"></script>
  <script src="market-data.js"></script>
  <script src="chart-3d-renderer.js"></script>
  <script src="chart-renderer.js"></script>
  <script src="shell.js"></script>
  <script src="page-controllers.js"></script>
</body>
</html>
