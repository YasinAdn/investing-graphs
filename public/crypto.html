<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crypto Live Charts &amp; Calculator — InvestGraph</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-page="crypto">
  <div class="app-container">
    <div id="sharedShellTop"></div>

    <main>
      <section class="graph-card">
        <div class="card-top-bar">
          <div class="card-title-wrap">
            <div class="title-with-risk">
              <h2 class="card-title" id="cardTitle">BTC Live Real Price</h2>
              <span class="risk-pill risk-high" id="riskBadge">Live 1s Real-Time • High Swings</span>
            </div>
            <p class="card-meta" id="cardMeta"></p>
          </div>

          <div class="mode-switch-bar">
            <button type="button" class="mode-btn active" id="viewLiveBtn">Live Price Graph</button>
            <button type="button" class="mode-btn" id="viewCalcBtn">Future Calculator</button>
          </div>
        </div>

        <div class="card-top-actions" style="margin-bottom:14px;">
          <div class="controls-toggles" id="symbolPills">
            <button type="button" class="toggle-chip active" data-sym="BTC">Bitcoin (BTC)</button>
            <button type="button" class="toggle-chip" data-sym="ETH">Ethereum (ETH)</button>
            <button type="button" class="toggle-chip" data-sym="SOL">Solana (SOL)</button>
            <button type="button" class="toggle-chip" data-sym="BNB">BNB</button>
            <button type="button" class="toggle-chip" data-sym="XRP">XRP</button>
          </div>

          <div class="controls-toggles" id="rangeBar">
            <button type="button" class="toggle-chip" data-range="1d">1D</button>
            <button type="button" class="toggle-chip" data-range="1w">1W</button>
            <button type="button" class="toggle-chip" data-range="1m">1M</button>
            <button type="button" class="toggle-chip active" data-range="1y">1Y</button>
            <button type="button" class="toggle-chip" data-range="5y">5Y</button>
          </div>
        </div>

        <div class="kpi-strip">
          <div class="kpi-item">
            <div class="kpi-value" id="kpi1Value">—</div>
            <div class="kpi-label" id="kpi1Label">Live Price</div>
            <div class="kpi-sub" id="kpi1Sub"></div>
          </div>
          <div class="kpi-divider" aria-hidden="true"></div>
          <div class="kpi-item">
            <div class="kpi-value kpi-green" id="kpi2Value">—</div>
            <div class="kpi-label" id="kpi2Label">Change</div>
            <div class="kpi-sub" id="kpi2Sub"></div>
          </div>
          <div class="kpi-divider" aria-hidden="true"></div>
          <div class="kpi-item">
            <div class="kpi-value" id="kpi3Value">—</div>
            <div class="kpi-label" id="kpi3Label">Yearly Average</div>
            <div class="kpi-sub" id="kpi3Sub"></div>
          </div>
        </div>

        <div class="plain-english-banner">
          <span class="plain-english-tag">In Simple Words</span>
          <p class="plain-english-text" id="plainEnglishText"></p>
        </div>

        <div class="chart-stage">
          <div id="chartContainer" class="chart-container"></div>
          <div id="chartTooltip" class="chart-tooltip"></div>
        </div>
        <div class="chart-legend" id="chartLegend"></div>

        <section class="controls-panel hidden" id="calcControlsWrap">
          <div class="controls-header">
            <div>
              <h3 class="controls-heading">Monthly Crypto Buying Simulator</h3>
              <p class="controls-sub">Slide below 0% to test what happens if prices drop</p>
            </div>
            <button type="button" class="toggle-chip" id="useHistReturnBtn">Use Real 5-Year Average Return</button>
          </div>
          <div class="sliders-grid" id="slidersGrid"></div>
        </section>
      </section>

      <section class="panel-card">
        <div class="panel-header">
          <div>
            <h3 class="panel-title">Live Crypto Prices (1-Second Stream)</h3>
            <p class="panel-sub">Click any coin to view its live chart above</p>
          </div>
          <span class="source-tag" id="watchSource">Connecting...</span>
        </div>
        <div class="market-cards-grid" id="watchGrid"></div>
      </section>

      <section class="panel-card hidden" id="ledgerCard"></section>
    </main>

    <footer class="app-footer" id="sharedShellFooter"></footer>
  </div>

  <script src="vendor/gsap.min.js"></script>
  <script src="vendor/three.min.js"></script>
  <script src="finance-engine.js"></script>
  <script src="market-data.js"></script>
  <script src="chart-3d-renderer.js"></script>
  <script src="chart-renderer.js"></script>
  <script src="shell.js"></script>
  <script src="page-controllers.js"></script>
</body>
</html>
